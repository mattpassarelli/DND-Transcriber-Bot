[project]
name = "dnd-scribe"
version = "0.1.0"
description = "D&D session transcription and summarization bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.4,<3.0",
    "discord-ext-voice-recv @ git+https://github.com/rdphillips7/discord-ext-voice-recv@ddd2860",
    "faster-whisper>=1.1,<2.0",
    "numpy>=1.26,<3.0",
    "PyNaCl>=1.5,<2.0",
    "python-dotenv>=1.0,<2.0",
    "psutil>=5.9,<8.0",
    "torch",
    "torchaudio",
    "requests>=2.28,<3.0",
    "davey>=0.1.5",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
